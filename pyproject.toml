[project]
name = "sandevistan-read"
version = "0.4.2"
description = "Local-first, source-grounded document intelligence workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4==4.13.4",
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "fsrs==6.3.2",
  "httpx==0.28.1",
  "numpy==2.3.2",
  "pydantic==2.11.7",
  "pymupdf==1.26.3",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "python-pptx==1.0.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
ai = [
  "onnxruntime==1.22.1",
  "rapidocr==3.3.0",
  "sentence-transformers[onnx]==5.1.0",
  "torch==2.13.0",
]
dev = [
  "playwright==1.54.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
sandevistan-read = "sandevistan_read.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandevistan_read"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
